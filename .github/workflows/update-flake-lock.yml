# Weekly input bump. Commits straight to main only if every machine's config still evaluates;
# comin on each machine then builds and switches to it.
name: update flake.lock

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays, 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31

      - run: nix flake update

      - name: Evaluate every machine
        run: |
          nix eval --raw .#darwinConfigurations.apollo.system.drvPath
          nix eval --raw .#darwinConfigurations.eos.system.drvPath
          nix eval --raw .#nixosConfigurations.eris.config.system.build.toplevel.drvPath

      - name: Commit and push
        run: |
          git diff --quiet flake.lock && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "flake.lock: update inputs" flake.lock
          git push
